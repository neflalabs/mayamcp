name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting, vet, staticcheck and race tests
        run: make check
      - name: Verify module checksums
        run: go mod verify
      - name: Consumer acceptance test (external module)
        run: make consumer-test
      - name: Build binary
        run: make build
      - name: Cross-compile check
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/mayamcp
          done

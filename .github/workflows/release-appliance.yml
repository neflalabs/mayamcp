name: Release Appliance

on:
  push:
    tags:
      - "appliance/v0.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without prefix, e.g. v0.1.0. Empty bumps v0.MINOR.0."
        required: false
        type: string

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve appliance version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#appliance/}"
            CREATE_TAG="false"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            CREATE_TAG="true"
          else
            LATEST="$(git tag -l 'appliance/v0.*' | sed -E 's|^appliance/v0\.([0-9]+)\..*|\1|' | sort -n | tail -n 1 || true)"
            NEXT=$([ -z "$LATEST" ] && echo 1 || echo $((LATEST + 1)))
            VERSION="v0.${NEXT}.0"
            CREATE_TAG="true"
          fi
          if ! [[ "$VERSION" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid appliance version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=appliance/$VERSION" >> "$GITHUB_OUTPUT"
          echo "create_tag=$CREATE_TAG" >> "$GITHUB_OUTPUT"

      - name: Tag commit
        if: steps.ver.outputs.create_tag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.ver.outputs.tag }}" -m "Appliance release ${{ steps.ver.outputs.version }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Verify appliance module
        working-directory: appliance
        run: GOWORK=off go test -count=1 ./...

      - name: Package source
        run: |
          tar -czf "mayamcp-appliance-${{ steps.ver.outputs.version }}.tar.gz" -C appliance .
          sha256sum "mayamcp-appliance-${{ steps.ver.outputs.version }}.tar.gz" > checksums-appliance.txt

      - name: Publish appliance release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: appliance ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            mayamcp-appliance-${{ steps.ver.outputs.version }}.tar.gz
            checksums-appliance.txt

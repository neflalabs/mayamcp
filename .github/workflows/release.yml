name: Release

on:
  push:
    tags:
      - "v20*"
  workflow_dispatch:
    inputs:
      version:
        description: "CalVer tag (e.g. v2026.11.7). Empty auto-increments current month."
        required: false
        type: string

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve CalVer
        id: calver
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            CREATE_TAG="false"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            CREATE_TAG="true"
          else
            PREFIX="v$(date -u +%Y.%m)"
            LATEST="$(git tag -l "${PREFIX}.*" | sed -E "s/^${PREFIX}\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)"
            NEXT=$([ -z "$LATEST" ] && echo 0 || echo $((LATEST + 1)))
            VERSION="${PREFIX}.${NEXT}"
            CREATE_TAG="true"
          fi
          if ! [[ "$VERSION" =~ ^v20[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "Invalid CalVer: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "create_tag=$CREATE_TAG" >> "$GITHUB_OUTPUT"

      - name: Tag commit
        if: steps.calver.outputs.create_tag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.calver.outputs.version }}" -m "Release ${{ steps.calver.outputs.version }}"
          git push origin "${{ steps.calver.outputs.version }}"

      - name: Build release binaries
        run: make release VERSION="${{ steps.calver.outputs.version }}"

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.calver.outputs.version }}
          name: ${{ steps.calver.outputs.version }}
          generate_release_notes: true
          files: dist/*

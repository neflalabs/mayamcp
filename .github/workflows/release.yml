name: Release

on:
  push:
    tags:
      - "v[0-9]*"
    tags-ignore:
      - "v20*" # legacy CalVer binary tags, kept for history only
  workflow_dispatch:
    inputs:
      version:
        description: "Semver tag (e.g. v0.2.0). Empty bumps the v0.MINOR.0 line."
        required: false
        type: string

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve module version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            CREATE_TAG="false"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            CREATE_TAG="true"
          else
            LATEST="$(git tag -l 'v0.*' | sed -E 's/^v0\.([0-9]+)\..*/\1/' | sort -n | tail -n 1 || true)"
            NEXT=$([ -z "$LATEST" ] && echo 1 || echo $((LATEST + 1)))
            VERSION="v0.${NEXT}.0"
            CREATE_TAG="true"
          fi
          if ! [[ "$VERSION" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semver tag: $VERSION (expected v0.MINOR.PATCH)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "create_tag=$CREATE_TAG" >> "$GITHUB_OUTPUT"

      - name: Tag commit
        if: steps.ver.outputs.create_tag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.ver.outputs.version }}" -m "Release ${{ steps.ver.outputs.version }}"
          git push origin "${{ steps.ver.outputs.version }}"

      - name: Build release binaries
        run: make release VERSION="${{ steps.ver.outputs.version }}"

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: dist/*
